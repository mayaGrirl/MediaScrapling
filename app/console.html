<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MediaScrapling</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #1c2430; }
    header { background: #16324f; color: #fff; padding: 20px 28px; }
    header p { margin: 6px 0 0; color: #c9d7e6; }
    main { max-width: 980px; margin: 0 auto; padding: 24px; display: grid; gap: 16px; }
    section { background: #fff; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(16, 24, 40, .06); }
    h2 { margin: 0 0 12px; font-size: 16px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input { flex: 1; min-width: 220px; border: 1px solid #cfd6df; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    button { border: 0; background: #1f6feb; color: #fff; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
    button.danger { background: #b42318; padding: 6px 10px; }
    a { color: #1f6feb; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #e8edf2; vertical-align: top; word-break: break-all; }
    .muted { color: #667; font-size: 13px; }
    .card { display: grid; gap: 10px; border-top: 1px solid #e8edf2; padding-top: 14px; margin-top: 14px; }
    video, img.cover, iframe { width: 100%; max-height: 420px; background: #111; border: 0; border-radius: 8px; }
    img.cover { object-fit: contain; background: #f4f6f8; max-height: 280px; }
    .done { color: #137333; } .failed { color: #b42318; } .running { color: #9a6700; }
  </style>
</head>
<body>
  <header>
    <strong>MediaScrapling</strong>
    <p>同一个平台操作网页采集和社交平台采集。已知站点自动走 MediaCrawler，其它地址走 Scrapling。 <a href="/logs" style="color:#fff">采集日志</a></p>
  </header>
  <main>
    <section>
      <h2>新建任务</h2>
      <form id="crawl">
        <input name="url" required placeholder="https://example.com 或视频页面地址" />
        <input name="keyword" placeholder="关键词，首页采集时必填，例如 美食" />
        <input name="limit" type="number" min="1" max="200" value="10" style="flex:0; min-width:90px" title="目标条数" />
        <input name="cookie" placeholder="Cookie 可留空，公开页面不需要登录" />
        <button type="submit">入队</button>
      </form>
      <p class="muted">条数填目标数量。没凑够会继续往下翻，连续 3 屏没有新视频才停止。代理池每 5 分钟从公开列表重测，只保留可用的，当前 <span id="proxy-count">-</span> 个。</p>
      <p class="muted" id="crawl-msg"></p>
    </section>
    <section>
      <h2>任务</h2>
      <p class="muted">未开始的任务可以删除。正在执行的任务会标记为停止，当前这一次采集结束后不再写入结果。</p>
      <table>
        <thead><tr><th>状态</th><th>能力</th><th>平台</th><th>地址</th><th>错误</th><th></th></tr></thead>
        <tbody id="jobs"></tbody>
      </table>
    </section>
    <section>
      <h2>采集结果</h2>
      <p class="muted">在当前页播放视频、查看封面图片，并用采集到的网页内容预览站点。代理由 MediaCrawler 与 Scrapling 在采集时处理。</p>
      <div id="videos"></div>
    </section>
  </main>
  <script>
    const jobs = document.querySelector("#jobs");
    const videos = document.querySelector("#videos");
    const crawlMsg = document.querySelector("#crawl-msg");

    let lastJobs = "";
    let lastVideos = "";

    async function refresh() {
      const [jobRows, videoRows, proxyInfo] = await Promise.all([
        fetch("/api/jobs").then((r) => r.json()),
        fetch("/api/videos").then((r) => r.json()),
        fetch("/api/proxies").then((r) => r.json()).catch(() => ({ count: 0 })),
      ]);
      document.querySelector("#proxy-count").textContent = proxyInfo.count;
      const jobsKey = JSON.stringify(jobRows);
      const videosKey = JSON.stringify(videoRows);
      if (jobsKey !== lastJobs) {
        lastJobs = jobsKey;
        jobs.innerHTML = jobRows.map((job) => `
        <tr>
          <td class="${escapeHtml(job.status)}">${escapeHtml(job.status)}</td>
          <td>${escapeHtml(job.capability)}</td>
          <td>${escapeHtml(job.platform || "-")}</td>
          <td>${escapeHtml(job.url)}</td>
          <td>${escapeHtml(job.error || "")}</td>
          <td><button class="danger" data-job="${escapeHtml(job.id)}">删除</button></td>
        </tr>`).join("") || `<tr><td colspan="6">还没有任务</td></tr>`;
      }
      if (videosKey !== lastVideos) {
        lastVideos = videosKey;
        videos.innerHTML = videoRows.map((item) => `
        <article class="card">
          <div><strong>${escapeHtml(item.title || "未命名")}</strong> · ${escapeHtml(item.platform)}
            ${link(item.source_url, "新窗口打开")}
            <button class="danger" data-video="${escapeHtml(item.raw.id)}">删除</button>
          </div>
          ${item.video_url ? `<video controls src="${escapeHtml(item.video_url)}" ${item.cover_url ? `poster="${escapeHtml(item.cover_url)}"` : ""}></video>` : ""}
          ${item.cover_url ? `<img class="cover" src="${coverSrc(item.cover_url)}" alt="封面" />` : ""}
          ${preview(item)}
        </article>`).join("") || `<p class="muted">还没有结果</p>`;
      }
    }

    function coverSrc(url) {
      if (url.includes("douyinpic.com")) return "/api/media?url=" + encodeURIComponent(url);
      return escapeHtml(url);
    }

    function preview(item) {
      if (item.raw.preview_html) return `<iframe sandbox srcdoc="${escapeHtml(item.raw.preview_html)}"></iframe>`;
      const url = item.source_url || "";
      if (url.includes("douyin.com")) return "";
      return `<iframe sandbox src="${escapeHtml(url)}"></iframe>`;
    }

    function link(url, label) {
      if (!url) return "-";
      return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${label}</a>`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    document.querySelector("#crawl").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      data.limit = Number(data.limit || 10);
      const response = await fetch("/api/jobs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const job = await response.json();
      crawlMsg.textContent = response.ok
        ? `已入队 ${job.id}，能力 ${job.capability}，平台 ${job.platform || "-"}`
        : (job.detail || "入队失败");
      event.target.reset();
      refresh();
    });

    document.querySelector("main").addEventListener("click", async (event) => {
      const jobId = event.target.dataset.job;
      const videoId = event.target.dataset.video;
      if (jobId) {
        await fetch(`/api/jobs/${jobId}`, { method: "DELETE" });
      }
      if (videoId) {
        await fetch(`/api/videos/${videoId}`, { method: "DELETE" });
      }
      if (jobId || videoId) refresh();
    });

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
