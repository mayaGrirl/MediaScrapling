<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MediaScrapling</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #1c2430; }
    header { background: #16324f; color: #fff; padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    header p { margin: 6px 0 0; color: #c9d7e6; font-size: 14px; }
    header a { color: #fff; }
    main { max-width: 1080px; margin: 0 auto; padding: 20px 24px 40px; }
    nav { display: flex; gap: 8px; margin-bottom: 16px; }
    nav button { background: #fff; color: #16324f; border: 1px solid #d5dde6; }
    nav button.active { background: #16324f; color: #fff; border-color: #16324f; }
    section { background: #fff; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(16, 24, 40, .06); }
    section[hidden] { display: none; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    form { display: grid; grid-template-columns: 1fr 180px; gap: 8px; }
    input { border: 1px solid #cfd6df; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    button { border: 0; background: #1f6feb; color: #fff; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
    button.danger { background: #b42318; padding: 6px 10px; }
    a { color: #1f6feb; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e8edf2; vertical-align: top; }
    td.url, td.err { word-break: break-word; max-width: 360px; }
    .status { white-space: nowrap; font-weight: 600; }
    .muted { color: #667; font-size: 13px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card { display: grid; gap: 8px; border: 1px solid #e8edf2; border-radius: 10px; padding: 12px; }
    video, img.cover { width: 100%; max-height: 220px; background: #f4f6f8; border: 0; border-radius: 8px; object-fit: contain; }
    .done { color: #137333; } .failed { color: #b42318; } .running, .pending { color: #9a6700; }
    #log-lines { margin: 0; min-height: 360px; padding: 14px; background: #101820; color: #d7e0ea; border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-family: Consolas, "Segoe UI", sans-serif; font-size: 13px; line-height: 1.5; }
    #log-lines .error { color: #ffb4ab; } #log-lines .warning { color: #ffd58a; }
    #logs .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>MediaScrapling</strong>
      <p>一个入口。具体视频链接走解析，国内站点搜索走 MediaCrawler，其他网页走 Scrapling。</p>
    </div>
  </header>
  <main>
    <nav>
      <button type="button" class="active" data-tab="create">新建</button>
      <button type="button" data-tab="jobs">任务</button>
      <button type="button" data-tab="results">结果</button>
      <button type="button" data-tab="logs">日志</button>
    </nav>
    <section id="create">
      <h2>新建任务</h2>
      <form id="crawl">
        <input name="url" required placeholder="视频链接、站点首页，或其他网页" />
        <input name="limit" type="number" min="1" max="200" value="10" title="目标条数" />
        <input name="keyword" placeholder="关键词。首页搜索时填写，例如 美食" />
        <input name="cookie" placeholder="Cookie，公开页面可留空" />
        <button type="submit">入队</button>
      </form>
      <p class="muted">目标条数没凑够会继续下翻，连续 3 屏没有新内容就停止。代理池每 5 分钟重测，当前可用 <span id="proxy-count">-</span> 个。旧任务列表里的 YouTube / TikTok 仍显示「网页」，那是分流改动之前入队的。</p>
      <p class="muted" id="crawl-msg"></p>
    </section>
    <section id="jobs" hidden>
      <h2>任务</h2>
      <p class="muted">未开始的任务可以删除。正在执行的任务会标记为停止，这一次采集结束后不再写入结果。</p>
      <table>
        <thead><tr><th>状态</th><th>方式</th><th>平台</th><th>地址</th><th>说明</th><th></th></tr></thead>
        <tbody id="job-rows"></tbody>
      </table>
    </section>
    <section id="results" hidden>
      <h2>采集结果</h2>
      <p class="muted">有播放地址就在卡片里播放，否则显示封面。外站页面不再嵌进本页。</p>
      <div class="cards" id="videos"></div>
    </section>
    <section id="logs" hidden>
      <div class="toolbar">
        <h2>采集日志</h2>
        <button class="danger" id="clear-logs" type="button">清屏</button>
      </div>
      <pre id="log-lines">正在读取日志…</pre>
    </section>
  </main>
  <script>
    const jobRows = document.querySelector("#job-rows");
    const videos = document.querySelector("#videos");
    const crawlMsg = document.querySelector("#crawl-msg");
    const names = { resolve: "链接解析", media: "站点搜索", web: "网页" };

    let lastJobs = "";
    let lastVideos = "";

    document.querySelector("nav").addEventListener("click", (event) => {
      const tab = event.target.dataset.tab;
      if (!tab) return;
      document.querySelectorAll("nav button").forEach((button) => button.classList.toggle("active", button.dataset.tab === tab));
      document.querySelectorAll("main section").forEach((section) => { section.hidden = section.id !== tab; });
      sessionStorage.setItem("tab", tab);
    });
    const savedTab = sessionStorage.getItem("tab");
    if (savedTab) document.querySelector(`nav button[data-tab="${savedTab}"]`)?.click();

    async function refresh() {
      const [jobs, videoRows, proxyInfo, logRows] = await Promise.all([
        fetch("/api/jobs").then((r) => r.json()),
        fetch("/api/videos").then((r) => r.json()),
        fetch("/api/proxies").then((r) => r.json()).catch(() => ({ count: 0 })),
        fetch("/api/logs").then((r) => r.json()).catch(() => []),
      ]);
      const logLines = document.querySelector("#log-lines");
      logLines.innerHTML = logRows.length
        ? logRows.map((row) => `<span class="${escapeHtml(row.level)}">${escapeHtml(row.created_at)} ${escapeHtml(row.level)} ${escapeHtml(row.message)}</span>`).join("\n")
        : "还没有采集日志。";
      document.querySelector("#proxy-count").textContent = proxyInfo.count;
      const jobsKey = JSON.stringify(jobs);
      const videosKey = JSON.stringify(videoRows);
      if (jobsKey !== lastJobs) {
        lastJobs = jobsKey;
        jobRows.innerHTML = jobs.map((job) => `
        <tr>
          <td class="status ${escapeHtml(job.status)}">${escapeHtml(job.status)}</td>
          <td>${escapeHtml(names[job.capability] || job.capability)}</td>
          <td>${escapeHtml(job.platform || "-")}</td>
          <td class="url">${escapeHtml(job.url)}</td>
          <td class="err">${escapeHtml(job.error || "")}</td>
          <td><button class="danger" data-job="${escapeHtml(job.id)}">删除</button></td>
        </tr>`).join("") || `<tr><td colspan="6">还没有任务</td></tr>`;
      }
      if (videosKey !== lastVideos) {
        lastVideos = videosKey;
        videos.innerHTML = videoRows.map((item) => `
        <article class="card">
          <div><strong>${escapeHtml(item.title || "未命名")}</strong></div>
          <div class="muted">${escapeHtml(item.platform)} ${link(item.source_url, "打开原页面")}
            <button class="danger" data-video="${escapeHtml(item.raw.id)}">删除</button>
          </div>
          ${item.video_url ? `<video controls src="${escapeHtml(item.video_url)}" ${item.cover_url ? `poster="${coverSrc(item.cover_url)}"` : ""}></video>` : ""}
          ${item.cover_url ? `<img class="cover" src="${coverSrc(item.cover_url)}" alt="封面" />` : ""}
        </article>`).join("") || `<p class="muted">还没有结果</p>`;
      }
    }

    function coverSrc(url) {
      if (url.includes("douyinpic.com")) return "/api/media?url=" + encodeURIComponent(url);
      return escapeHtml(url);
    }

    function link(url, label) {
      if (!url) return "";
      return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${label}</a>`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    document.querySelector("#crawl").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      data.limit = Number(data.limit || 10);
      const response = await fetch("/api/jobs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const job = await response.json();
      crawlMsg.textContent = response.ok
        ? `已入队，方式 ${names[job.capability] || job.capability}，平台 ${job.platform || "-"}`
        : (job.detail || "入队失败");
      const limit = data.limit;
      event.target.reset();
      event.target.limit.value = limit;
      document.querySelector('nav button[data-tab="jobs"]').click();
      refresh();
    });

    document.querySelector("main").addEventListener("click", async (event) => {
      const jobId = event.target.dataset.job;
      const videoId = event.target.dataset.video;
      if (jobId) await fetch(`/api/jobs/${jobId}`, { method: "DELETE" });
      if (videoId) await fetch(`/api/videos/${videoId}`, { method: "DELETE" });
      if (jobId || videoId) {
        lastJobs = "";
        lastVideos = "";
        refresh();
      }
    });

    document.querySelector("#clear-logs").addEventListener("click", async () => {
      await fetch("/api/logs", { method: "DELETE" });
      document.querySelector("#log-lines").textContent = "日志已清空。";
    });

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
