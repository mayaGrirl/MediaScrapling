<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MediaScrapling</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #1c2430; }
    header { background: #16324f; color: #fff; padding: 20px 28px; }
    header p { margin: 6px 0 0; color: #c9d7e6; }
    main { max-width: 980px; margin: 0 auto; padding: 24px; display: grid; gap: 16px; }
    section { background: #fff; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(16, 24, 40, .06); }
    h2 { margin: 0 0 12px; font-size: 16px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input { flex: 1; min-width: 220px; border: 1px solid #cfd6df; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    button { border: 0; background: #1f6feb; color: #fff; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #e8edf2; vertical-align: top; word-break: break-all; }
    .muted { color: #667; font-size: 13px; }
    .done { color: #137333; } .failed { color: #b42318; } .running { color: #9a6700; }
  </style>
</head>
<body>
  <header>
    <strong>MediaScrapling</strong>
    <p>同一个平台操作网页采集和社交平台采集。已知站点自动走 MediaCrawler，其它地址走 Scrapling。</p>
  </header>
  <main>
    <section>
      <h2>新建任务</h2>
      <form id="crawl">
        <input name="url" required placeholder="https://example.com 或视频页面地址" />
        <input name="keyword" placeholder="关键词，可留空" />
        <button type="submit">入队</button>
      </form>
      <p class="muted" id="crawl-msg"></p>
    </section>
    <section>
      <h2>代理池</h2>
      <form id="proxy">
        <input name="proxy_url" required placeholder="http://127.0.0.1:7890" />
        <button type="submit">添加</button>
      </form>
      <p class="muted" id="proxies"></p>
    </section>
    <section>
      <h2>任务</h2>
      <table>
        <thead><tr><th>状态</th><th>能力</th><th>平台</th><th>地址</th><th>错误</th></tr></thead>
        <tbody id="jobs"></tbody>
      </table>
    </section>
  </main>
  <script>
    const jobs = document.querySelector("#jobs");
    const proxies = document.querySelector("#proxies");
    const crawlMsg = document.querySelector("#crawl-msg");

    async function refresh() {
      const [jobRows, proxyRows] = await Promise.all([
        fetch("/api/jobs").then((r) => r.json()),
        fetch("/api/proxies").then((r) => r.json()),
      ]);
      proxies.textContent = proxyRows.length ? proxyRows.join("，") : "还没有代理，任务会直连。";
      jobs.innerHTML = jobRows.map((job) => `
        <tr>
          <td class="${escapeHtml(job.status)}">${escapeHtml(job.status)}</td>
          <td>${escapeHtml(job.capability)}</td>
          <td>${escapeHtml(job.platform || "-")}</td>
          <td>${escapeHtml(job.url)}</td>
          <td>${escapeHtml(job.error || "")}</td>
        </tr>`).join("") || `<tr><td colspan="5">还没有任务</td></tr>`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    document.querySelector("#crawl").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      const response = await fetch("/api/jobs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const job = await response.json();
      crawlMsg.textContent = response.ok
        ? `已入队 ${job.id}，能力 ${job.capability}，平台 ${job.platform || "-"}`
        : (job.detail || "入队失败");
      event.target.reset();
      refresh();
    });

    document.querySelector("#proxy").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      await fetch("/api/proxies", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      event.target.reset();
      refresh();
    });

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
