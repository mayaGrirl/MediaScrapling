[project]
name = "universal-video-crawler"
version = "0.1.0"
description = "One platform that runs MediaCrawler platform jobs and Scrapling web jobs together."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pymysql>=1.1",
    "redis>=5.2",
    "scrapling[fetchers]>=0.2",
    "sqlalchemy>=2.0",
    "typer>=0.15",
    "yt-dlp>=2025.1",
    "agent-reach @ git+https://github.com/Panniantong/Agent-Reach.git",
    "uvicorn>=0.32",
]

[project.scripts]
crawler = "app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["*.html"]
